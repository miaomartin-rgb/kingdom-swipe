<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0810;
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;color:#fff;padding:24px;z-index:5;}
  .hidden{display:none!important;}
  .title{font-size:clamp(30px,9vw,56px);font-weight:900;letter-spacing:.08em;
    background:linear-gradient(180deg,#ffe9a8,#f0b342 55%,#b8791d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 22px rgba(240,179,66,.35);}
  .sub{margin-top:10px;font-size:clamp(13px,3.6vw,17px);color:#c9c2e6;line-height:1.75;}
  .btn{margin-top:26px;padding:15px 42px;border:none;border-radius:999px;font-size:19px;
    font-weight:800;color:#3a2405;cursor:pointer;letter-spacing:.06em;
    background:linear-gradient(180deg,#ffe07a,#eeab2c);
    box-shadow:0 8px 0 #8a5c13,0 14px 26px rgba(0,0,0,.5);transition:transform .08s;}
  .btn:active{transform:translateY(4px);box-shadow:0 4px 0 #8a5c13,0 8px 16px rgba(0,0,0,.5);}
  .btn.ghost{background:linear-gradient(180deg,#4b4470,#332e52);color:#e8e3ff;
    box-shadow:0 6px 0 #221f38,0 10px 20px rgba(0,0,0,.45);font-size:16px;padding:12px 30px;}
  .panel{background:rgba(18,14,32,.86);border:1px solid rgba(255,215,130,.28);
    border-radius:22px;padding:28px 26px;backdrop-filter:blur(8px);max-width:400px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .big{font-size:clamp(26px,7.5vw,40px);font-weight:900;}
  .stat{margin-top:14px;font-size:16px;color:#ffd98a;font-weight:700;}
  .hint{margin-top:20px;font-size:13px;color:#8f88b5;}
  #mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:6;
    width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
    background:rgba(20,16,34,.6);color:#e9e4ff;font-size:17px;cursor:pointer;line-height:36px;}
  .swipehint{position:absolute;bottom:26%;left:0;right:0;text-align:center;color:#fff;
    font-size:15px;font-weight:700;letter-spacing:.05em;opacity:.9;z-index:4;
    text-shadow:0 2px 10px #000;animation:pulse 1.6s infinite;pointer-events:none;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .btn+.btn{margin-top:12px;}
  .reward{margin-top:12px;font-size:15px;color:#7dffc0;font-weight:700;min-height:22px;}
  .gold{margin:10px 0 4px;font-size:20px;font-weight:900;color:#ffd257;letter-spacing:.04em;}
  #upList{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .up{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,215,130,.18);text-align:left;}
  .up-info{flex:1;min-width:0;}
  .up-name{font-size:14px;font-weight:800;color:#f2ecff;}

  .up-pips{display:flex;gap:3px;margin-top:5px;}
  .up-pip{width:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);}
  .up-pip.on{background:#ffd257;}
  .up-buy{flex:none;border:none;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:800;
    color:#3a2405;background:linear-gradient(180deg,#ffe07a,#eeab2c);cursor:pointer;
    box-shadow:0 4px 0 #8a5c13;white-space:nowrap;}

  .up-buy.max{background:#2f4a3d;color:#7dffc0;box-shadow:0 4px 0 #1d2f27;}

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="safeTop" style="position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);pointer-events:none;"></div>
  <button id="mute">♪</button>

  <div id="menu" class="layer">
    <div class="panel">
      <div class="title">王國遠征</div>
      <div class="sub">你是光輝王國最後的統帥。<br>帶著你的騎士穿越暗影之地，<br>擊倒盤據在盡頭的魔物。</div>
      <div class="sub" style="color:#ffd98a;margin-top:16px;">👉 按住畫面左右拖曳<br>挑選能讓兵力變多的那道門</div>
      <button class="btn" id="startBtn">出征</button>
      <button class="btn ghost" id="menuUpBtn">王國升級</button>
      <div class="hint">支援手機觸控 ／ 鍵盤左右鍵</div>
    </div>
  </div>

  <div id="swipeHint" class="swipehint hidden">← 按住拖曳選門 →</div>

  <div id="result" class="layer hidden">
    <div class="panel">
      <div class="big" id="resTitle">勝利！</div>
      <div class="sub" id="resDesc"></div>
      <div class="stat" id="resStat"></div>
      <div class="reward" id="resReward"></div>
      <button class="btn hidden" id="adDoubleBtn">📺 金幣加倍</button>
      <button class="btn" id="nextBtn">繼續</button>
      <button class="btn ghost" id="upBtn">王國升級</button>
      <button class="btn ghost" id="retryBtn">重新開始</button>
    </div>
  </div>

  <div id="upgrade" class="layer hidden">
    <div class="panel">
      <div class="big" style="font-size:24px">王國升級</div>
      <div class="gold" id="upGold">🪙 0</div>
      <div id="upList"></div>
      <button class="btn" id="upCloseBtn">回去出征</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ========== 畫布 ========== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1,CX=0,HZ=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2;
  const wide = W/H > 1.15;
  HZ = H*(wide?0.34:0.27);
  CAM_H = wide? 3.5 : 5.6;
  FOCAL = Math.max(210, Math.min(W*0.86, 420));
  buildSky();
  buildSprites();
  buildGradients();
}

/* 只跟畫布尺寸有關的漸層，建一次就好。原本這些每幀都重新配置一個物件。 */
const GRAD = {};
function buildGradients(){
  const g1 = ctx.createLinearGradient(0,HZ,0,H);
  g1.addColorStop(0,'#1d2a2b'); g1.addColorStop(1,'#0e1618');
  GRAD.ground = g1;
  const g2 = ctx.createLinearGradient(0,HZ,0,HZ+H*0.16);
  g2.addColorStop(0,'rgba(125,58,82,.85)'); g2.addColorStop(1,'rgba(125,58,82,0)');
  GRAD.fog = g2;
  const g3 = ctx.createRadialGradient(CX,H*0.55,Math.min(W,H)*0.35,CX,H*0.55,Math.max(W,H)*0.75);
  g3.addColorStop(0,'rgba(0,0,0,0)'); g3.addColorStop(1,'rgba(0,0,0,.55)');
  GRAD.vignette = g3;
  const bw = W*0.5, bx = CX-bw/2;
  const g4 = ctx.createLinearGradient(bx,0,bx+bw,0);
  g4.addColorStop(0,'#7de3ff'); g4.addColorStop(1,'#ffd257');
  GRAD.progress = g4;
  const hw = W*0.72, hx = CX-hw/2;
  const g5 = ctx.createLinearGradient(hx,0,hx+hw,0);
  g5.addColorStop(0,'#ff3d5e'); g5.addColorStop(1,'#ff9d4d');
  GRAD.bossbar = g5;

  const fs = Math.min(52, W*0.13), yy = H*0.845;
  const g6 = ctx.createLinearGradient(0,yy-fs/2,0,yy+fs/2);
  g6.addColorStop(0,'#fff6cf'); g6.addColorStop(1,'#ffc94d');
  GRAD.armyText = g6;

  // 火把光暈：預繪成一張貼圖，執行期只 drawImage
  const gl = document.createElement('canvas');
  gl.width = gl.height = 64;
  const glg = gl.getContext('2d');
  const gr = glg.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,180,60,.8)'); gr.addColorStop(1,'rgba(255,140,40,0)');
  glg.fillStyle = gr; glg.fillRect(0,0,64,64);
  GRAD.glow = gl;

  // 閘門底色：兩張直條貼圖，拉伸後與原本的漸層一致
  const strip = (c2,c1) => {
    const cc = document.createElement('canvas');
    cc.width = 4; cc.height = 64;
    const cg = cc.getContext('2d');
    const lg = cg.createLinearGradient(0,0,0,64);
    lg.addColorStop(0,c2); lg.addColorStop(1,c1);
    cg.fillStyle = lg; cg.fillRect(0,0,4,64);
    return cc;
  };
  GRAD.gateGood = strip('rgba(40,180,255,.16)','rgba(70,225,160,.34)');
  GRAD.gateBad  = strip('rgba(150,20,60,.16)','rgba(240,70,90,.34)');
}
window.addEventListener('resize', resize);

/* ========== 透視 ========== */
let FOCAL = 320;
let CAM_H = 5.6;
const ROAD_HALF = 4.6;
// 巨人召集期間整條橋加寬，左右兩道才有空間各自站得下
let RH = ROAD_HALF;
const PLAYER_DZ = 8.6;
let camZ = 0;
function scaleAt(z){ const dz=z-camZ; return dz<0.6?null:FOCAL/dz; }
function px(x,s){ return CX + x*s; }
function py(y,s){ return HZ + (CAM_H-y)*s; }

/* ========== 音效 ========== */
let actx=null, muted=false;
function beep(freq,dur,type,vol){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
// context 一旦被瀏覽器暫停（切分頁、iOS 回前景）就再也不會自己恢復，必須手動 resume
function resumeAudio(){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
document.getElementById('mute').onclick = function(){
  muted=!muted; this.textContent = muted?'✕':'♪';
  if(!muted) resumeAudio();
  saveGame({muted:muted});
};

/* ========== 城牆防守（插曲）數值 ==========
   全部集中在這裡，之後調平衡只動這一塊。
   要塞進度 = 擊殺數 / 配額，配額只由關卡決定，不看兵力。
   敵人血量用 army^0.75（次線性）→ 擊殺率 ∝ army^0.25，
   兵越多打得越快、漏進來的越少，不會像王戰那樣把兵力優勢直接抵銷掉。 */
/* ========== 巨人召集（插曲）數值 ==========
   畫面縱向切成兩道：左道是你的軍隊與正在組裝的巨人，右道是敵人縱隊。
   打掉的數量累積成巨人的組裝進度；漏過去的敵人會把進度撞回去。
   這一段刻意不扣兵力 —— 它是「賺一個獎勵」的關卡，不是第二個死亡點。 */
const SIEGE = {
  duration    : 18,     // 上限秒數
  quotaBase   : 26,     // 組裝進度 = 擊殺數 / 配額；配額只看關卡
  quotaLv     : 3,
  spawnRate   : 2.9,    // 每秒放幾個（固定值，不隨配額變）
  hpC         : 4.8,    // 單兵 hp = hpC * army^hpExp * (1+hpLv*(lv-1))
  hpExp       : 0.75,   //   次線性 → 兵越多殺得越快
  hpLv        : 0.10,
  volley      : 0.14,
  dmgPerArmy  : 0.5,
  columnHalf  : 2.2,    // 主要火力覆蓋的橫向寬度 → 對準哪一排是唯一的技巧
  strayMul    : 0.60,   // 沒對準也不是全無輸出，只是效率差
  focusFoes   : 3,
  tracerMax   : 40,
  foeSpeed    : 7.2,
  rangeZ      : 24,
  setback     : 1.0,    // 每漏一個，組裝進度倒退幾個擊殺（鐵甲會減免）
  spawnZ      : 36,
  hordeZ      : 32,
  roadHalf    : 5.2,    // 這一段的橋面寬度（平時是 4.6）
  crowdSpread : 0.68,   // 隊伍縮一點，走位才靈活
  lanes       : [1.0, 2.3, 3.6],// 敵人縱隊走右側三排
  startX      : -1.6,   // 開場刻意不在任何一排上，要主動去攔
  giantZ      : 8,      // 巨人組裝的位置（左前方）
  giantX      : -2.7,
  giantScale  : 2.2,    // 巨人身高 = 一般士兵的幾倍
  minBuild    : 0.5,    // 組裝到這個比例以上才召得出來
  bossMul     : 0.35,   // 巨人加成：王戰傷害 +bossMul*power
  tollMul     : 0.30    // 巨人加成：雜兵團損耗 -tollMul*power
};

/* ========== 遊戲狀態 ========== */
const G = {
  state:'menu',       // menu | play | result
  level:1,
  army:25,
  x:0, targetX:0, z:0,
  speed:10,
  objs:[], length:100,
  combat:null, boss:null, bossFight:false,
  siege:null, giant:null,
  floats:[], parts:[],
  shake:0, flash:0, flashColor:'255,60,60',
  best:0, tick:0, rank:0, rankF:0
};

/* ========== 經濟數值 ==========
   全部集中在這裡。tools/balance-sim.js 必須跟這一塊保持同步。

   三個刻意的設計決定：
   1. 每關有一條「參考兵力」ref(lv)，加法閘門與雜兵團強度都依它縮放。
      這樣數字不會被兵力本身放大，成長是多項式而不是指數。
   2. 加法值刻意設在 ref 附近 → 「×2 還是 +N」的交叉點就落在玩家實際
      的兵力區間內，答案會隨當下數字翻面，選門才是真的選擇。
   3. 雜兵團改成按比例損耗，成本永遠存在，不會被兵力成長稀釋成零。   */
const BAL = {
  ref        : lv => Math.round(40 * Math.pow(1.5, lv-1)), // 每關參考兵力
  // 每關從 ref 重新開始，上一關的殘兵只換成有上限的獎勵。
  // 若讓兵力整條繼承，指數成長會跨關累積，四關後數字就失控。
  carryBonus : 0.25,
  carryCapMul: 0.60,     // 獎勵上限 = carryCapMul * ref(lv)
  bothGood   : 0.78,     // 兩邊都是好處的機率（其餘保留一個明顯的壞門）
  mulMax     : lv => 1 + Math.floor((lv-1)/3),  // 每關最多幾道乘法門
                         // 乘法必然造成指數成長，唯一的控制手段就是限制次數
  mulVal     : 2,
  addLo      : 0.40, addHi: 0.78,   // 加法值 = ref * [lo,hi]
  pctLo      : 18,   pctHi : 35,    // 百分比門 +P%。乘法用完後改用它配對加法門：
                                    // 交叉點 = N/(P/100) 剛好落在該關兵力區間內，
                                    // 而且成長遠比 ×2 溫和，不會失控
  divChance  : 0.35,     // 壞門是除法的機率
  divVal     : 2,
  subLo      : 0.25, subHi: 0.45,   // 減法值 = ref * [lo,hi]
  squadLo    : 0.09, squadHi: 0.16, // 雜兵團扣掉當前兵力的這個比例（真的按比例）
  // 設計上抵達王前的兵力。這串數字是 tools/balance-sim.js 量出來的中位曲線
  // 取 75%（介於「每門都選對」與「隨機亂選」之間），第 9 關起以 1.6 倍外推。
  // 王的血量對齊這條曲線 —— 關卡決定難度，玩家的累積決定他打得多輕鬆。
  expectTable: [110, 278, 421, 1163, 1712, 2501, 5769, 9015],
  expect     : lv => lv <= BAL.expectTable.length
                 ? BAL.expectTable[lv-1]
                 : Math.round(BAL.expectTable[BAL.expectTable.length-1] *
                              Math.pow(1.6, lv - BAL.expectTable.length)),
  bossSecs   : 3.5,      // 期望兵力下的王戰時長
  bossDmgC   : 0.8,      // 王戰 DPS = army^bossDmgExp * bossDmgC
  bossDmgExp : 0.85,     // 次線性：多帶有用，但邊際遞減
  // 血量對齊「設計上的期望兵力」，而不是玩家當下的兵力 ——
  // 這是關鍵差別：關卡決定難度，玩家的累積決定他打得多輕鬆。
  siegeEvery : 5,      // 每幾關出現一次巨人召集。每關都有就不叫 bonus 了
  speedBase  : 10,
  speedStep  : 1.05,   // 每關 ×1.05
  speedCap   : 16,     // 上限。閘門間距 15，速度 16 時只剩約 0.94 秒可以比較兩邊
  speed      : lv => Math.min(BAL.speedCap, BAL.speedBase * Math.pow(BAL.speedStep, lv-1)),
  bossHp     : lv => Math.round(BAL.bossDmgC *
                       Math.pow(BAL.expect(lv), BAL.bossDmgExp) * BAL.bossSecs)
};

/* ========== 數字顯示 ========== */
// 兵力會長到四、五位數，原本直接印整數會撐爆 HUD
function fmtNum(n){
  n = Math.floor(n);
  if(n < 10000) return String(n);
  if(n < 100000000) return (n/10000).toFixed(n < 100000 ? 1 : 0) + '萬';
  return (n/100000000).toFixed(1) + '億';
}

/* ========== 存檔 ========== */
const SAVE_KEY = 'kingdom.v1';
const SAVE_DEFAULTS = { best:0, maxLevel:1, muted:false, runs:0, gold:0, up:null, rankF:0, giant:null };
function loadSave(){
  let s;
  try{ s = Object.assign({}, SAVE_DEFAULTS, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
  catch(e){ s = Object.assign({}, SAVE_DEFAULTS); }   // 無痕模式／配額滿時安靜退回預設
  s.up = Object.assign({}, UP_DEFAULTS, s.up || {});
  return s;
}
function saveGame(patch){
  const next = Object.assign(loadSave(), patch);
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(next)); }catch(e){}
  return next;
}

/* ========== 永久升級（meta 層） ==========
   市場資料：玩家通常在第 3–5 次 session 需要碰到進度或解鎖系統，
   否則 D1 之後沒有回來的理由。這是最小可行的一組，刻意只有四條線。 */
const UPGRADES = [

// 遊戲內即時查詢的乘數
const MUL = {
  start : ()=> 1 + 0.06*upLevel('army'),
  loss  : ()=> 1 - 0.04*upLevel('armor'),

/* ========== 數據埋點 ==========
   先寫成統一介面，之後接哪一家（GA4 / Firebase / 通路自帶）只要換 sink。
   沒有這些事件，後面所有調校都是猜測。 */
const DEBUG = /[?&]debug=1/.test(location.search);
const Analytics = {
  queue: [],
  send(name, props){
    // props 先展開，name/t 後蓋上 —— 否則 props 裡的 name 會把事件名稱吃掉
    const ev = Object.assign({}, props||{}, { t: Math.round(performance.now()), name });
    this.queue.push(ev);
    if(this.queue.length > 400) this.queue.shift();
    if(DEBUG) console.log('[analytics]', name, props||'');
    // 真實 sink 之後接在這裡（window.gtag / 通路 SDK）
  }
};

/* ========== 獎勵式影片 ==========
   佈點依市場建議放在摩擦點：失敗畫面、結算、出征前。
   這裡是 stub —— 介面固定，之後接 Poki / CrazyGames SDK 只要換 provider。 */
// 還沒接任何廣告平台，所以整組佈點關閉，玩家看不到按鈕。
// 之後拿到帳號時把這個改成 true 並注入 provider 即可，其餘程式碼不用動。
const ADS_ENABLED = false;
const Ads = {
  provider: null,     // 之後注入 {rewarded: () => Promise<boolean>}
  shown: 0,
  available(){ return ADS_ENABLED && this.shown < 3; },  // 單場 3 次上限
  rewarded(placement){
    Analytics.send('ad_offer', {placement});
    if(!this.available()) return Promise.resolve(false);
    Analytics.send('ad_start', {placement});
    const done = this.provider
      ? this.provider.rewarded(placement)
      : Promise.resolve(true);          // 沒接 SDK 時直接給獎勵，方便本地測試
    return Promise.resolve(done).then(ok=>{
      if(ok){ this.shown++; Analytics.send('ad_complete', {placement}); }
      return ok;
    });
  }

/* ========== 關卡生成 ========== */
function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }

function addOp(lv){
  return {op:'+', val: Math.max(4, Math.round(BAL.ref(lv) * rnd(BAL.addLo, BAL.addHi)))};
}
function pctOp(){ return {op:'%', val: Math.round(rnd(BAL.pctLo, BAL.pctHi))}; }
function badOp(lv){
  if(Math.random() < BAL.divChance) return {op:'/', val: BAL.divVal};
  return {op:'-', val: Math.max(3, Math.round(BAL.ref(lv) * rnd(BAL.subLo, BAL.subHi)))};
}
// budget 追蹤這一關還剩幾道乘法門可以發
function makeGate(z, lv, budget){
  const canMul = budget.mul > 0;
  let a,b;
  if(Math.random() < BAL.bothGood){
    // 兩邊都是好處。乘法門一定配一個加法門，讓「×2 還是 +N」成為真的比較
    // 一定是「比例 vs 定量」的配對，答案取決於當下兵力；
    // 絕不生成 +19 vs +19 這種兩邊同型的假選擇
    if(canMul && Math.random() < 0.45){ budget.mul--; a = {op:'x', val: BAL.mulVal}; }
    else a = pctOp();
    b = addOp(lv);
  }else{
    if(canMul && Math.random() < 0.35){ budget.mul--; a = {op:'x', val: BAL.mulVal}; }
    else a = addOp(lv);
    b = badOp(lv);
  }
  if(Math.random()<0.5){ const t=a;a=b;b=t; }
  return {type:'gate', z, left:a, right:b, used:false, hit:0};
}
function makeSquad(z, lv, i){
  // frac 是「會扣掉當前兵力的比例」。用比例而非絕對值，成本才不會被兵力成長稀釋。
  const frac = Math.min(0.42, rnd(BAL.squadLo, BAL.squadHi) * (0.85 + 0.10*i));
  return {type:'squad', z, frac, count:0, dead:false, engaged:false, wob:Math.random()*6};
}
function makeSiege(z){ return {type:'siege', z, done:false}; }
const BOSSES = ['暗影巨魔','腐骨龍','熔岩巨獸','虛空領主','冥王 · 賽拉斯'];
function buildLevel(lv){
  const objs=[]; let z=22;
  const stages = 5 + Math.min(4, lv-1);
  const budget = { mul: BAL.mulMax(lv) };
  for(let i=0;i<stages;i++){
    let g = makeGate(z, lv, budget);
    // 第一關的第一道門：兩邊都是好處，先給一次無條件的成功再開始考人
    if(lv===1 && i===0){
      g.left  = {op:'x', val:2};
      g.right = {op:'+', val: Math.max(12, Math.round(BAL.ref(1)*0.7))};
    }
    objs.push(g); z += 15;
    if(i%2===1 || i===stages-1){ objs.push(makeSquad(z, lv, i)); z += 13; }
  }
  // 巨人召集：每 BAL.siegeEvery 關一次，排在閘門跑完、王戰之前
  if(lv % BAL.siegeEvery === 0){ z += 10; objs.push(makeSiege(z)); z += 16; }
  else z += 6;
  const hp = BAL.bossHp(lv);
  const boss = {type:'boss', z, hp, max:hp, base:hp, dps: 0.20 + lv*0.006,
    name: BOSSES[(lv-1)%BOSSES.length] + (lv>BOSSES.length?(' +'+Math.floor((lv-1)/BOSSES.length)):''),
    swing:0, dead:false};
  objs.push(boss);
  // 裝飾旗幟
  for(let d=14; d<z+8; d+=7){
    objs.push({type:'deco', z:d, side:-1});
    objs.push({type:'deco', z:d+3.5, side:1});
  }
  G.boss = boss;
  return {objs, length:z};
}

function startLevel(lv, carry){
  G.level = lv;
  G.speed = BAL.speed(lv);
  // 每關從 ref 重新開始，殘兵只換成有上限的獎勵
  G.army = Math.round((BAL.ref(lv) + (carry
    ? Math.min(Math.round(carry * BAL.carryBonus), Math.round(BAL.carryCapMul * BAL.ref(lv)))
    : 0)) * MUL.start());
  G.x=0; G.targetX=0; G.z=0; camZ = -PLAYER_DZ;
  const L = buildLevel(lv);
  G.objs = L.objs; G.length = L.length;
  G.combat=null; G.bossFight=false; G.siege=null; G.floats=[]; G.parts=[];
  RH = ROAD_HALF;
  G.checkpointArmy = G.army;
  G.promo = null;   // 巨人刻意不在這裡清掉 —— 它要陪你打完接下來幾關
  reviveUsed = false;
  Analytics.send('run_start', {level:lv, army:G.army, up:loadSave().up});
  G.shake=0; G.flash=0;
  G.state='play';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  const sh=document.getElementById('swipeHint');
  sh.classList.remove('hidden');
  setTimeout(()=>sh.classList.add('hidden'), 3200);
}

/* ========== 操控 ========== */
let dragging=false, dragStartScreen=0, dragStartX=0;
function screenToRoad(sx){
  const s = FOCAL/PLAYER_DZ;
  return (sx - CX)/s;
}
cv.addEventListener('pointerdown', e=>{
  if(G.state!=='play') return;
  dragging=true; dragStartScreen = screenToRoad(e.clientX); dragStartX = G.targetX;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  resumeAudio();
});
function clampX(x){ return Math.max(-RH+0.5, Math.min(RH-0.5, x)); }
cv.addEventListener('pointermove', e=>{
  if(!dragging || G.state!=='play') return;
  const d = screenToRoad(e.clientX) - dragStartScreen;
  G.targetX = clampX(dragStartX + d*1.25);
});
function endDrag(){ dragging=false; }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e=>{
  if(G.state!=='play') return;
  if(e.key==='ArrowLeft'||e.key==='a') G.targetX = clampX(G.targetX-1.6);
  if(e.key==='ArrowRight'||e.key==='d') G.targetX = clampX(G.targetX+1.6);
});

/* ========== 特效 ========== */
function addFloat(text,color,x,z,size){
  G.floats.push({text,color,x,z,t:0,size:size||1});
}
// 物件池 + 交換移除：粒子不再每次配置新物件，也不再用 O(n) 的 splice
const PART_MAX = 260;
const _partPool = [];
function burst(x,z,n,color){
  for(let i=0;i<n;i++){
    if(G.parts.length >= PART_MAX) return;
    const p = _partPool.pop() || {};
    p.x=x+rnd(-1,1); p.z=z+rnd(-.8,.8); p.y=rnd(0.3,1.2);
    p.vx=rnd(-1.6,1.6); p.vy=rnd(2,5.2); p.vz=rnd(-1,1);
    p.t=0; p.life=rnd(.45,.9); p.color=color;
    G.parts.push(p);
  }
}

/* ========== 城牆防守（插曲） ========== */
function startSiege(o){
  o.done = false;
  o.t = 0;
  o.killed = 0; o.spawned = 0; o.leaked = 0;
  o.dmgAcc = 0; o.volleyN = 0; o.volleyAcc = 0; o.spawnAcc = 0;
  o.foes = []; o.tracers = [];
  o.army0 = Math.max(1, G.army);
  G.checkpointArmy = G.army;
  o.quota = SIEGE.quotaBase + SIEGE.quotaLv * (G.level - 1);
  o.foeHp = Math.max(6, SIEGE.hpC * Math.pow(o.army0, SIEGE.hpExp) *
                        (1 + SIEGE.hpLv * (G.level - 1)));
  o.setback = SIEGE.setback * MUL.loss();
  G.giant = null;          // 重新召集，舊的巨人退場
  G.siege = o;
  RH = SIEGE.roadHalf;
  // 開場刻意不在任何一排上，不主動去攔就只有半效
  G.targetX = SIEGE.startX;
  addFloat('召集巨人！','#ffe9a8', -2.2, G.z + 3, 1.15);
  beep(150,.35,'sawtooth',.07);
}

function siegeVolley(s, lineZ){
  s.volleyN++;
  if(!s.foes.length) return;
  // 主火力只覆蓋正前方一欄；欄內沒目標就打最近的，但效率打折
  const inRange = s.foes.filter(f => f.z - lineZ < SIEGE.rangeZ);
  if(!inRange.length) return;
  // 站到哪就打到哪。原本用隔牆鏡射，但玩家的直覺是「移過去擋住牠們」，
  // 被牆擋住只會覺得卡住，所以改成直接攔截。
  const aim = G.x;
  let pool = inRange.filter(f => Math.abs(f.x - aim) < SIEGE.columnHalf);
  let mul = 1;
  if(!pool.length){ pool = inRange.slice(); mul = SIEGE.strayMul; }
  pool.sort((a,b) => a.z - b.z);

  let left = Math.max(1, G.army * SIEGE.dmgPerArmy * mul), now = 0;
  for(let i=0; i<pool.length && i<SIEGE.focusFoes && left>0; i++){
    const f = pool[i];
    const hit = Math.min(f.hp, left);
    f.hp -= hit; left -= hit; now += hit;
    if(s.tracers.length < SIEGE.tracerMax){
      s.tracers.push({x0: G.x + rnd(-1.4,1.4), z0: lineZ, x1: f.x, z1: f.z, t:0, life:.11});
    }
  }
  s.dmgAcc += now;
  for(let i=s.foes.length-1; i>=0; i--){
    if(s.foes[i].hp <= 0){
      const f = s.foes[i];
      burst(f.x, f.z, 9, '#ffd05a');
      s.foes.splice(i,1);
      s.killed++;
    }
  }
  // 每 4 次齊射跳一個大數字，抄影片那個節奏，不要每幀洗版
  if(s.volleyN % 4 === 0 && s.dmgAcc >= 1){
    const f = s.foes[0];
    addFloat('-'+Math.round(s.dmgAcc), '#ff5a72',
             f ? f.x : G.x, (f ? f.z : G.z + 18) + 0.8, 1.2);
    s.dmgAcc = 0;
  }
  if(Math.random() < 0.45) beep(rnd(320,430), .04, 'square', .022);
}

function updateSiege(dt){
  const s = G.siege;
  s.t += dt;
  const lineZ = G.z + 1.4;

  // 配額內的敵人在 spawnWindow 秒內平均放完
  if(s.spawned < s.quota){
    s.spawnAcc += dt * SIEGE.spawnRate;
    while(s.spawnAcc >= 1 && s.spawned < s.quota){
      s.spawnAcc -= 1; s.spawned++;
      s.foes.push({
        x: SIEGE.lanes[ri(0, SIEGE.lanes.length - 1)] + rnd(-.35,.35),
        z: G.z + SIEGE.spawnZ + rnd(-5, 5),
        hp: s.foeHp * rnd(.85,1.15), ph: Math.random() * 6.28, q: Math.random()
      });
    }
  }

  s.volleyAcc += dt;
  while(s.volleyAcc >= SIEGE.volley){ s.volleyAcc -= SIEGE.volley; siegeVolley(s, lineZ); }

  // 敵人推進；衝到陣線且離你夠近才咬兵力，閃得開就只是跑過去
  for(let i=s.foes.length-1; i>=0; i--){
    const f = s.foes[i];
    f.z -= SIEGE.foeSpeed * dt;
    if(f.z <= lineZ){
      // 衝過去的敵人撞上組裝中的巨人，把進度撞回去。
      // 這一段不扣兵力 —— 它是賺獎勵的關卡，不是第二個死亡點。
      s.leaked++;
      s.killed = Math.max(0, s.killed - s.setback);
      burst(SIEGE.giantX, G.z + SIEGE.giantZ, 9, '#ff6b8a');
      addFloat('組裝 -1', '#ff7d92', SIEGE.giantX, G.z + SIEGE.giantZ + 1.2, 0.95);
      G.shake = Math.max(G.shake, 7);
      beep(90,.11,'sawtooth',.055);
      s.foes.splice(i,1);
    }
  }

  for(let i=s.tracers.length-1; i>=0; i--){
    const t = s.tracers[i]; t.t += dt;
    if(t.t > t.life) s.tracers.splice(i,1);
  }

  if(s.killed >= s.quota) endSiege(s);
  else if(s.spawned >= s.quota && !s.foes.length) endSiege(s);
  else if(s.t >= SIEGE.duration) endSiege(s);
}

function endSiege(s){
  s.done = true; G.siege = null;
  RH = ROAD_HALF;
  const p = Math.min(1, s.killed / s.quota);
  if(p >= SIEGE.minBuild){
    // 組裝到一半以上就召得出來，威力按完成度給 —— 不設全有全無的門檻
    G.giant = { power: p, ph: Math.random()*6.28 };
    addFloat('巨人加入戰線！', '#7dffc0', G.x, G.z + 2.6, 1.3);
    burst(SIEGE.giantX, G.z + 6, 50, '#ffd05a');
    G.flash = .48; G.flashColor = '255,220,120'; G.shake = 12;
    beep(300,.22,'sawtooth',.08);
    setTimeout(()=>beep(560,.26,'triangle',.08), 140);
    setTimeout(()=>beep(840,.34,'triangle',.08), 300);
    Analytics.send('giant_summon', {level:G.level, power:+p.toFixed(2), leaked:s.leaked});
  }else{
    addFloat('組裝失敗 '+Math.floor(p*100)+'%', '#ff9d9d', G.x, G.z + 2.6, 1.1);
    beep(220,.3,'sawtooth',.06);
    Analytics.send('giant_fail', {level:G.level, progress:+p.toFixed(2), leaked:s.leaked});
  }
}

/* ========== 士兵編隊 ==========
   兩件事同時解決：
   1. 成長要看得見 —— 原本無論兵力多少都只畫 130 個小人，第 2 關之後
      「變強」就沒有視覺回饋。改成三段 LOD，畫得出來的數量與footprint
      都隨兵力成長。
   2. 效能 —— 原本每個士兵約 10 次 canvas 路徑操作（橢圓、圓角矩形、
      圓弧…）。改成啟動時把士兵預繪成精靈圖，執行期只做 drawImage。 */
const CROWD = {
  max       : 240,    // 畫得出來的上限（原本是 130）
  radiusExp : 0.18,   // footprint = base * (count/130)^radiusExp
  radiusCap : 1.15,   // 上限，避免整團溢出路面
  shrink    : 0.34    // 人越多每個畫得越小，密度上升
};
const FORM_N = CROWD.max;
const FORM=[];
for(let i=0;i<FORM_N;i++){
  const r = 0.205*Math.sqrt(i), a = i*2.39996;
  // q：0.72 依中心距離 + 0.28 隨機，讓換裝有秩序又不會排成整齊的圈
  const q = Math.min(0.999, 0.72*(i/FORM_N) + 0.28*Math.random());
  FORM.push([Math.cos(a)*r, Math.sin(a)*r, Math.random()*6.28, q]);
}
function crowdRadiusMul(count){
  return count<=130 ? 1 : Math.min(CROWD.radiusCap, Math.pow(count/130, CROWD.radiusExp));
}

/* ---------- 兵種階級 ----------
   兵力變多時，士兵本身也要升級 —— 光是「更多一樣的小人」到後面就麻痺了。
   門檻對齊實際的兵力曲線（第 8 關約 1.2 萬），不是隨手抓的整數，
   否則最高階會永遠看不到。敵人用同一個尺度跟著升級，雙方一起變壯。 */
const TIER_AT = [0, 250, 1200, 5000];
const TIER_NAME = ['民兵','步兵','精銳','騎士'];
function tierFor(count){
  let t = 0;
  for(let i=TIER_AT.length-1; i>=0; i--){ if(count >= TIER_AT[i]){ t = i; break; } }
  return t;
}
// 連續版本：1.3 代表「大部分是步兵，三成已經升到精銳」。
// 整團一次換太生硬，用小數才有混編的層次。
function tierFloat(count){
  if(count <= TIER_AT[1]) return Math.max(0, count / TIER_AT[1]);
  for(let i=1; i<TIER_AT.length-1; i++){
    if(count < TIER_AT[i+1])
      return i + Math.log(count/TIER_AT[i]) / Math.log(TIER_AT[i+1]/TIER_AT[i]);
  }
  return TIER_AT.length - 1;
}
// 每個編隊位置的「升遷順位」q：q 越小越早換裝。
// 由中心往外遞增，所以精銳會集中在隊伍核心，外圍還是舊兵 —— 這就是層次。
function tierAt(rankF, q, n){
  const t = Math.floor(rankF + 0.999 - q);
  return t < 0 ? 0 : (t > n-1 ? n-1 : t);
}
// 每階一組配色 + 造型旗標。cape / plume / plate / shield / horn 由 paintUnit 讀取。

   metal:'#b09070', weapon:'#c98a4a', helm:true,  weap:true, cape:'#3d0f1c', horn:'#e6dcc4'},
  {key:'f3', body:'#5c1f6b', dark:'#320f3c', accent:'#ff6bd0', skin:'#5f8a48',
   metal:'#c6a8e0', weapon:'#ff9de0', helm:true,  weap:true, cape:'#1d0824', horn:'#f2e6ff',
   plate:true}

ALLY_TIERS.forEach((t,i)=>{ t.id = i; });
FOE_TIERS.forEach((t,i)=>{ t.id = 4 + i; });
// 軍階只升不降，而且跨關保留。
// 每關的兵力都是從 ref(lv) 重新開始（40/60/90…），若直接用當下兵力決定造型，
// 玩家會在每關開頭掉回民兵、再重新升一次步兵 —— 同一個晉升反覆出現，
// 而且永遠到不了精銳。改成「歷史最高兵力換到的軍階」，晉升才是單向的獎勵。

/* ---------- 精靈圖：啟動與 resize 時預繪一次 ---------- */
const SPR = { sizes:[5,8,12,18,26,38,56,82,120], frames:3, cache:null };
function roundRectOn(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function roundRect(x,y,w,h,r){ roundRectOn(ctx,x,y,w,h,r); }
// 原本的向量畫法，現在只在預繪時跑。pal 上的旗標決定這一階多畫什麼。
function paintUnit(g, sx, sy, s, pal, phase, facing){
  const h = 1.0*s, w = h*0.40;
  const bob = Math.sin(phase)*h*0.07;
  const base = sy, top = base - h + bob;
  const legH = h*0.26, bodyH = h*0.46;
  const headR = h*0.155, headY = top + headR*1.35;

  g.fillStyle='rgba(0,0,0,0.26)';
  g.beginPath(); g.ellipse(sx, base, w*0.78, w*0.30, 0,0,6.283); g.fill();

  // 披風畫在身體後面
  if(pal.cape && h > 10){
    g.fillStyle = pal.cape;
    g.beginPath();
    g.moveTo(sx-w*0.46, base-legH-bodyH*0.92+bob);
    g.lineTo(sx+w*0.46, base-legH-bodyH*0.92+bob);
    g.lineTo(sx+w*0.72, base-legH*0.15+bob);
    g.lineTo(sx-w*0.72, base-legH*0.15+bob);
    g.closePath(); g.fill();
  }

  g.fillStyle = pal.dark;
  g.fillRect(sx-w*0.42, base-legH, w*0.32, legH);
  g.fillRect(sx+w*0.12, base-legH, w*0.32, legH);

  // 板甲階級的身體用金屬色，並多一條胸甲高光
  g.fillStyle = pal.plate ? pal.metal : pal.body;
  roundRectOn(g, sx-w*0.5, base-legH-bodyH+bob, w, bodyH, w*0.28); g.fill();
  if(pal.plate && h > 12){
    g.fillStyle = 'rgba(255,255,255,.28)';
    g.fillRect(sx-w*0.34, base-legH-bodyH*0.86+bob, w*0.18, bodyH*0.62);
  }
  g.fillStyle = pal.accent;
  g.fillRect(sx-w*0.5, base-legH-bodyH*0.34+bob, w, Math.max(1,h*0.055));

  g.fillStyle = pal.skin;
  g.beginPath(); g.arc(sx, headY, headR, 0, 6.283); g.fill();

  if(pal.helm){
    g.fillStyle = pal.metal;
    g.beginPath(); g.arc(sx, headY, headR*1.12, Math.PI*1.02, Math.PI*2.0); g.fill();
  }
  // 盔纓：一眼就分得出精銳與騎士
  if(pal.plume && h > 12){
    g.fillStyle = pal.plume;
    g.beginPath();
    g.moveTo(sx-headR*0.30, headY-headR*0.95);
    g.lineTo(sx+headR*0.30, headY-headR*0.95);
    g.lineTo(sx+headR*0.10, headY-headR*2.15);
    g.lineTo(sx-headR*0.55, headY-headR*1.75);
    g.closePath(); g.fill();
  }
  // 魔物的角
  if(pal.horn && h > 10){
    g.fillStyle = pal.horn;
    for(const dir of [-1, 1]){
      g.beginPath();
      g.moveTo(sx + dir*headR*0.55, headY - headR*0.45);
      g.lineTo(sx + dir*headR*1.30, headY - headR*1.75);
      g.lineTo(sx + dir*headR*0.30, headY - headR*1.05);
      g.closePath(); g.fill();
    }
  }
  // 盾牌畫在持武器的另一側
  if(pal.shield && h > 14){
    g.fillStyle = pal.shield;
    const shx = sx - facing*w*0.62;
    roundRectOn(g, shx-w*0.20, base-legH-bodyH*0.86+bob, w*0.40, bodyH*0.78, w*0.14); g.fill();
    g.fillStyle = 'rgba(0,0,0,.22)';
    g.fillRect(shx-w*0.05, base-legH-bodyH*0.80+bob, w*0.10, bodyH*0.66);
  }
  if(pal.weap && h > 16){
    g.strokeStyle = pal.weapon; g.lineWidth = Math.max(1,h*0.05);
    g.beginPath();
    const wx = sx + facing*w*0.66;
    g.moveTo(wx, base-legH-bodyH*0.15+bob);
    g.lineTo(wx, base-legH-bodyH-h*0.16+bob);
    g.stroke();
  }
}
// 改成用到才畫：4 階 × 2 陣營 × 2 朝向 × 3 影格 × 9 尺寸 = 432 張，
// 一次全建太浪費，實際一場只會用到其中一兩階
function buildSprites(){ SPR.cache = new Array(8*2*SPR.frames*SPR.sizes.length); }
function makeSprite(pal, facing, frame, size){
  const w = Math.ceil(size*0.72), h = Math.ceil(size*1.40), baseY = size*1.26;
  const c = document.createElement('canvas');
  c.width = Math.max(1,Math.ceil(w*DPR)); c.height = Math.max(1,Math.ceil(h*DPR));
  const g = c.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  paintUnit(g, w/2, baseY, size, pal, frame/SPR.frames*6.283, facing);
  return {c, w, h, baseY, size};
}
function spriteFor(pal, facing, frame, s){
  const sizes = SPR.sizes;
  let si = sizes.length-1;
  for(let i=0;i<sizes.length;i++){ if(sizes[i] >= s){ si = i; break; } }
  // 純數字索引，避免每次呼叫都組一個字串當 key
  const idx = ((pal.id*2 + (facing>0?0:1))*SPR.frames + frame)*sizes.length + si;
  let sp = SPR.cache[idx];
  if(!sp) sp = SPR.cache[idx] = makeSprite(pal, facing, frame, sizes[si]);
  return sp;
}
// 對外介面不變，內部改成貼圖
function drawUnit(sx, sy, s, pal, phase, facing){
  if(s < 3){ ctx.fillStyle = pal.body; ctx.fillRect(sx-1, sy-s, 2.2, s); return; }
  const frame = ((phase*0.4777)|0) % SPR.frames;   // phase -> 0..2 的走路影格
  const sp = spriteFor(pal, facing, frame < 0 ? 0 : frame, s);
  if(!sp){ ctx.fillStyle = pal.body; ctx.fillRect(sx-1, sy-s, 2.2, s); return; }
  const k = s / sp.size;
  ctx.drawImage(sp.c, sx - sp.w*0.5*k, sy - sp.baseY*k, sp.w*k, sp.h*k);
}

/* ---------- 由遠而近繪製 ----------
   小尺寸的精靈貼圖成本與 fillRect 相當，但看起來是人不是柵欄，
   所以整團統一用精靈，不再分色塊層。 */
const _cbuf = [];   // 重複使用的緩衝，避免每幀配置物件
for(let i=0;i<FORM_N;i++) _cbuf.push({z:0,x:0,y:0,s:0,f:0,p:null});

function drawCrowd(cxWorld, z, count, tiers, facing, spread){
  if(!scaleAt(z)) return;
  const total = Math.max(1, Math.floor(count));
  const n     = Math.min(total, FORM_N);
  const mul   = crowdRadiusMul(total) * (spread||1);
  // 人越多，每個畫得越小 → 同樣的地面塞進更多人，超過繪製上限之後
  // 仍然能靠密度看出差別
  const shrink = 1 / (1 + CROWD.shrink * Math.log10(Math.max(1, total/130)));

  const rankF = G.rankF || 0, nt = tiers.length;
  let m = 0;
  for(let i=0;i<n;i++){
    const f = FORM[i];
    const zz = z + f[1]*mul*0.75;
    const ss = scaleAt(zz); if(!ss) continue;
    const u = _cbuf[m++];
    u.z=zz; u.x=px(cxWorld+f[0]*mul, ss); u.y=py(0, ss); u.s=ss*shrink; u.f=f[2];
    u.p = tiers[tierAt(rankF, f[3], nt)];
  }
  const view = _cbuf.slice(0, m);
  view.sort((a,b)=>b.z-a.z);          // 由遠而近
  for(let i=0;i<m;i++){
    const u = view[i];
    drawUnit(u.x, u.y, u.s, u.p, u.f + G.tick*7, facing);
  }
}

/* ========== 天空 ========== */
let skyCanvas=null;
function buildSky(){
  skyCanvas = document.createElement('canvas');
  skyCanvas.width = Math.max(2,Math.round(W)); skyCanvas.height = Math.max(2,Math.round(HZ+2));
  const g = skyCanvas.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,HZ);
  grad.addColorStop(0,'#1a1030'); grad.addColorStop(0.55,'#3b1f4d'); grad.addColorStop(1,'#7d3a52');
  g.fillStyle=grad; g.fillRect(0,0,W,HZ);
  // 月亮
  g.fillStyle='rgba(255,235,190,.9)';
  g.beginPath(); g.arc(W*0.76, HZ*0.30, Math.max(12,W*0.045),0,6.283); g.fill();
  g.fillStyle='rgba(255,235,190,.12)';
  g.beginPath(); g.arc(W*0.76, HZ*0.30, Math.max(30,W*0.11),0,6.283); g.fill();
  // 星星
  g.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<60;i++){
    const sx=Math.random()*W, sy=Math.random()*HZ*0.75, r=Math.random()*1.4+0.3;
    g.globalAlpha=Math.random()*0.8+0.2;
    g.beginPath(); g.arc(sx,sy,r,0,6.283); g.fill();
  }
  g.globalAlpha=1;
  // 遠山與城堡剪影
  g.fillStyle='#241534';
  g.beginPath(); g.moveTo(0,HZ);
  let x=0;
  while(x<W){ const h=HZ*(0.18+Math.random()*0.22); g.lineTo(x, HZ-h); x+=W*0.14; g.lineTo(x, HZ-h*0.5); }
  g.lineTo(W,HZ); g.closePath(); g.fill();
  // 城堡
  g.fillStyle='#1b0f27';
  const bx=W*0.14, bw=W*0.2, bh=HZ*0.30;
  g.fillRect(bx, HZ-bh, bw, bh);
  for(let i=0;i<4;i++) g.fillRect(bx+i*(bw/4), HZ-bh-HZ*0.05, bw/7, HZ*0.05);
  g.fillRect(bx-bw*0.18, HZ-bh*1.4, bw*0.2, bh*1.4);
  g.fillRect(bx+bw*0.98, HZ-bh*1.25, bw*0.2, bh*1.25);
}

/* ========== 場景 ========== */
function drawGround(){
  // 草地
  ctx.fillStyle=GRAD.ground; ctx.fillRect(0,HZ,W,H-HZ);
  // 道路
  const far = camZ + 70, near = camZ + 1.0;
  const sF = scaleAt(far), sN = scaleAt(near);
  if(!sF||!sN) return;
  ctx.fillStyle='#3b3346';
  ctx.beginPath();
  ctx.moveTo(px(-RH,sF), py(0,sF));
  ctx.lineTo(px(RH,sF), py(0,sF));
  ctx.lineTo(px(RH,sN), py(0,sN));
  ctx.lineTo(px(-RH,sN), py(0,sN));
  ctx.closePath(); ctx.fill();
  // 條紋
  const start = Math.floor((camZ)/5)*5;
  for(let z=start; z<camZ+70; z+=5){
    const i = Math.round(z/5);
    if(i%2) continue;
    const s1=scaleAt(z), s2=scaleAt(z+5);
    if(!s1||!s2) continue;
    ctx.fillStyle='rgba(255,255,255,0.035)';
    ctx.beginPath();
    ctx.moveTo(px(-RH,s2), py(0,s2));
    ctx.lineTo(px(RH,s2), py(0,s2));
    ctx.lineTo(px(RH,s1), py(0,s1));
    ctx.lineTo(px(-RH,s1), py(0,s1));
    ctx.closePath(); ctx.fill();
  }
  // 邊線
  ctx.strokeStyle='rgba(255,214,130,.28)'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(px(-RH,sF),py(0,sF)); ctx.lineTo(px(-RH,sN),py(0,sN));
  ctx.moveTo(px(RH,sF),py(0,sF)); ctx.lineTo(px(RH,sN),py(0,sN));
  ctx.stroke();
  // 中線（提示分道）
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(px(0,sF),py(0,sF)); ctx.lineTo(px(0,sN),py(0,sN)); ctx.stroke();
  // 霧
  ctx.fillStyle=GRAD.fog; ctx.fillRect(0,HZ,W,H*0.16);
}

function opLabel(o){
  if(o.op==='x') return '×'+o.val;
  if(o.op==='/') return '÷'+o.val;
  if(o.op==='%') return '+'+o.val+'%';
  if(o.op==='+') return '+'+o.val;
  return '−'+o.val;
}
function opGood(o){ return o.op==='x'||o.op==='+'||o.op==='%'; }

function drawGate(g){
  const s = scaleAt(g.z); if(!s) return;
  const h = 2.9;
  const yTop = py(h,s), yBot = py(0,s);
  const xL = px(-RH,s), xM = px(0,s), xR = px(RH,s);
  const halves = [[xL,xM,g.left],[xM,xR,g.right]];
  for(const [x0,x1,op] of halves){
    const good = opGood(op);
    const c1 = good? 'rgba(70,225,160,.34)' : 'rgba(240,70,90,.34)';
    const c2 = good? 'rgba(40,180,255,.16)' : 'rgba(150,20,60,.16)';
    ctx.drawImage(good ? GRAD.gateGood : GRAD.gateBad, x0, yTop, x1-x0, yBot-yTop);
    ctx.strokeStyle = good? 'rgba(110,255,190,.85)':'rgba(255,110,130,.85)';
    ctx.lineWidth = Math.max(1.5, s*0.035);
    ctx.strokeRect(x0, yTop, x1-x0, yBot-yTop);
    // 標籤（遠處淡出，避免重疊）
    const dz = g.z - camZ;
    ctx.globalAlpha = Math.max(0, Math.min(1, (30-dz)/10));
    const fs = Math.max(11, s*0.68);
    ctx.font = '900 '+fs+'px system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const tx=(x0+x1)/2, ty=yTop+(yBot-yTop)*0.42;
    ctx.lineWidth = Math.max(2, fs*0.16); ctx.strokeStyle='rgba(0,0,0,.65)';
    ctx.strokeText(opLabel(op), tx, ty);
    ctx.fillStyle = good? '#b6ffe0' : '#ffc2cc';
    ctx.fillText(opLabel(op), tx, ty);
    ctx.globalAlpha = 1;
  }
  // 中柱與橫樑
  ctx.fillStyle='rgba(255,224,150,.9)';
  const pw = Math.max(2, s*0.09);
  ctx.fillRect(xM-pw/2, yTop, pw, yBot-yTop);
  ctx.fillRect(xL, yTop-pw*0.7, xR-xL, pw*0.9);
}

function drawDeco(d){
  const s = scaleAt(d.z); if(!s) return;
  const x = px(d.side*(RH+0.55), s);
  const base = py(0,s), h = 2.2*s;
  ctx.fillStyle='#2a2038'; ctx.fillRect(x-Math.max(1,s*0.05), base-h, Math.max(2,s*0.1), h);
  // 火把光
  const r = Math.max(2, s*0.22);
  const fy = base-h;
  const R = r*3;
  ctx.drawImage(GRAD.glow, x-R, fy-R, R*2, R*2);
  ctx.fillStyle='#ffd98a'; ctx.beginPath(); ctx.arc(x,fy,r*0.7,0,6.283); ctx.fill();
}

function drawSquad(q){
  if(q.dead) return;
  // 還沒接戰的敵軍，人數依當前兵力即時估算，玩家看到的數字才等於真的會付的代價
  const n = Math.max(1, Math.ceil(q.engaged ? q.count : G.army * q.frac));
  drawCrowd(0, q.z, n, FOE_TIERS, -1, 1);
  const s = scaleAt(q.z); if(!s) return;
  const fs = Math.max(12, s*0.5);
  ctx.font='900 '+fs+'px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const ty = py(2.4 + crowdRadiusMul(n)*0.2, s);
  ctx.lineWidth=Math.max(2,fs*0.18); ctx.strokeStyle='rgba(0,0,0,.7)';
  ctx.strokeText(fmtNum(n), px(0,s), ty);
  ctx.fillStyle='#ff8a9a'; ctx.fillText(fmtNum(n), px(0,s), ty);
}

function drawBoss(b){
  const s = scaleAt(b.z); if(!s) return;
  if(b.dead) return;
  const base = py(0,s);
  const H0 = 6.2*s;
  const w = H0*0.62;
  const sw = Math.sin(b.swing*6)*H0*0.04;
  const cxp = px(0,s);
  // 影子
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(cxp, base, w*0.85, w*0.2,0,0,6.283); ctx.fill();
  // 翅膀
  ctx.fillStyle='#2b1030';
  ctx.beginPath();
  ctx.moveTo(cxp-w*0.3, base-H0*0.75);
  ctx.quadraticCurveTo(cxp-w*1.5, base-H0*1.05+sw, cxp-w*1.15, base-H0*0.35);
  ctx.quadraticCurveTo(cxp-w*0.75, base-H0*0.55, cxp-w*0.3, base-H0*0.6);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cxp+w*0.3, base-H0*0.75);
  ctx.quadraticCurveTo(cxp+w*1.5, base-H0*1.05-sw, cxp+w*1.15, base-H0*0.35);
  ctx.quadraticCurveTo(cxp+w*0.75, base-H0*0.55, cxp+w*0.3, base-H0*0.6);
  ctx.fill();
  // 腿
  ctx.fillStyle='#4a1730';
  ctx.fillRect(cxp-w*0.42, base-H0*0.32, w*0.3, H0*0.32);
  ctx.fillRect(cxp+w*0.12, base-H0*0.32, w*0.3, H0*0.32);
  // 身體
  const bg=ctx.createLinearGradient(0,base-H0,0,base);
  bg.addColorStop(0,'#8c2246'); bg.addColorStop(1,'#3e0f26');
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.ellipse(cxp, base-H0*0.52, w*0.55, H0*0.30, 0,0,6.283); ctx.fill();
  // 手臂
  ctx.strokeStyle='#6d1b3a'; ctx.lineWidth=w*0.2; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cxp-w*0.45, base-H0*0.62); ctx.lineTo(cxp-w*0.85, base-H0*0.25+sw*2);
  ctx.moveTo(cxp+w*0.45, base-H0*0.62); ctx.lineTo(cxp+w*0.85, base-H0*0.25-sw*2);
  ctx.stroke();
  // 頭
  const hy = base-H0*0.86;
  ctx.fillStyle='#6d1b3a';
  ctx.beginPath(); ctx.ellipse(cxp, hy, w*0.36, w*0.30,0,0,6.283); ctx.fill();
  // 角
  ctx.fillStyle='#e6dcc4';
  ctx.beginPath(); ctx.moveTo(cxp-w*0.3, hy-w*0.16);
  ctx.lineTo(cxp-w*0.62, hy-w*0.78); ctx.lineTo(cxp-w*0.12, hy-w*0.3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cxp+w*0.3, hy-w*0.16);
  ctx.lineTo(cxp+w*0.62, hy-w*0.78); ctx.lineTo(cxp+w*0.12, hy-w*0.3); ctx.fill();
  // 眼
  const eg = 0.6+0.4*Math.sin(G.tick*6);
  ctx.fillStyle='rgba(255,220,60,'+eg+')';
  ctx.beginPath(); ctx.ellipse(cxp-w*0.14, hy, w*0.075, w*0.05,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cxp+w*0.14, hy, w*0.075, w*0.05,0,0,6.283); ctx.fill();
}

// 巨人：組裝中是半透明線稿，由下往上填實；完成後跟著隊伍走
const _giantBuf = { c:null, ghost:null, size:0 };
function giantCanvas(size){
  if(_giantBuf.c && _giantBuf.size === size) return _giantBuf.c;
  const w = Math.ceil(size*0.72), h = Math.ceil(size*1.40);
  const mk = () => {
    const c = document.createElement('canvas');
    c.width = Math.max(1,Math.ceil(w*DPR)); c.height = Math.max(1,Math.ceil(h*DPR));
    const g = c.getContext('2d');
    g.setTransform(DPR,0,0,DPR,0,0);
    paintUnit(g, w/2, size*1.26, size, ALLY_TIERS[3], 0, 1);
    return {c,g};
  };
  const solid = mk();
  const ghost = mk();
  // 只把「畫到的像素」染成青色，所以 source-atop 必須在這張離屏畫布上做
  ghost.g.globalCompositeOperation = 'source-atop';
  ghost.g.fillStyle = '#7de3ff';
  ghost.g.fillRect(0, 0, w, h);
  _giantBuf.c = solid.c; _giantBuf.ghost = ghost.c;
  _giantBuf.size = size; _giantBuf.w = w; _giantBuf.h = h;
  return _giantBuf.c;
}
function drawGiant(xWorld, z, unitScale, built){
  const sc = scaleAt(z); if(!sc) return;
  const size = Math.max(8, sc * SIEGE.giantScale);
  const c = giantCanvas(Math.round(Math.min(260, size)));
  const k = size / _giantBuf.size;
  const dw = _giantBuf.w * k, dh = _giantBuf.h * k;
  const dx = px(xWorld, sc) - dw*0.5, dy = py(0, sc) - _giantBuf.size*1.26*k;

  if(built < 1){
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.drawImage(_giantBuf.ghost, dx, dy, dw, dh);
    ctx.restore();
  }
  // 已組好的部分：由下往上填實
  if(built > 0){
    ctx.save();
    ctx.beginPath();
    ctx.rect(dx, dy + dh*(1-built), dw, dh*built);
    ctx.clip();
    ctx.drawImage(c, dx, dy, dw, dh);
    ctx.restore();
    if(built < 1){
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.35*Math.sin(G.tick*7);
      ctx.strokeStyle = '#7de3ff'; ctx.lineWidth = 2;
      const ly = dy + dh*(1-built);
      ctx.beginPath(); ctx.moveTo(dx-4, ly); ctx.lineTo(dx+dw+4, ly); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ========== HUD ========== */
function drawHUD(){
  const top = 10 + (document.getElementById('safeTop').offsetHeight||0);
  // 進度條
  const bw = W*0.5, bx = CX-bw/2, by = top+10, bh=8;
  ctx.fillStyle='rgba(0,0,0,.45)';
  roundRect(bx,by,bw,bh,bh/2); ctx.fill();
  const p = Math.max(0,Math.min(1, G.z/G.length));
  ctx.fillStyle=GRAD.progress; roundRect(bx,by,Math.max(bh,bw*p),bh,bh/2); ctx.fill();
  // 王旗標記
  ctx.fillStyle='#ff6b8a'; ctx.font='900 12px system-ui'; ctx.textAlign='center';
  ctx.textBaseline='bottom'; ctx.fillText('☠', bx+bw, by-2);
  // 關卡
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font='800 14px system-ui,sans-serif'; ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText('第 '+G.level+' 關', 14, top+6);

  // 兵力
  const n = Math.max(0, Math.floor(G.army));
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs = Math.min(52, W*0.13);
  ctx.font='900 '+fs+'px system-ui,sans-serif';
  const yy = H*0.845;
  const txt = fmtNum(n);
  ctx.lineWidth=fs*0.16; ctx.strokeStyle='rgba(0,0,0,.75)';
  ctx.strokeText(txt, CX, yy);
  ctx.fillStyle=GRAD.armyText; ctx.fillText(txt, CX, yy);
  ctx.font='800 12px system-ui'; ctx.fillStyle='rgba(255,255,255,.62)';
  ctx.fillText(TIER_NAME[G.rank|0]+' · 兵力', CX, yy+fs*0.62);

  // 巨人隨行標記
  if(G.giant && !G.siege){
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.font='800 12px system-ui,sans-serif';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.7)';
    const gt = '🗡 巨人隨行 ×'+(1 + SIEGE.bossMul*G.giant.power).toFixed(2);
    ctx.strokeText(gt, 14, top+26);
    ctx.fillStyle='#7dffc0'; ctx.fillText(gt, 14, top+26);
  }

  // 兵種晉升橫幅
  if(G.promo && G.promo.t >= 0){
    const t = G.promo.t;
    const fade = t < 0.16 ? t/0.16 : (t > 1.40 ? Math.max(0, (1.85-t)/0.45) : 1);
    const pop  = t < 0.16 ? 0.82 + 0.18*(t/0.16)
                          : (t < 0.34 ? 1.08 - 0.08*((t-0.16)/0.18) : 1);
    const by = H*0.30, bw = Math.min(W*0.78, 330)*pop, bh = 74*pop;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(14,10,26,.82)';
    roundRect(CX-bw/2, by-bh/2, bw, bh, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,130,.75)'; ctx.lineWidth = 2;
    roundRect(CX-bw/2, by-bh/2, bw, bh, 16); ctx.stroke();
    ctx.textAlign='center';
    ctx.textBaseline='alphabetic';
    ctx.font='800 '+(13*pop)+'px system-ui,sans-serif';
    ctx.fillStyle='#c9c2e6';
    ctx.fillText('全軍晉升', CX, by - bh*0.10);
    ctx.font='900 '+(30*pop)+'px system-ui,sans-serif';
    ctx.fillStyle='#ffd257';
    ctx.fillText(G.promo.name, CX, by + bh*0.30);
    ctx.restore();
  }

  // 城牆防守倒數
  if(G.siege){
    const s = G.siege;
    const left = Math.max(0, SIEGE.duration - s.t);
    const pct  = Math.floor(Math.min(1, s.killed / s.quota) * 100);
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font='900 15px system-ui,sans-serif';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.75)';
    const txt = '巨人組裝 '+pct+'%   剩 '+left.toFixed(1)+'s';
    ctx.strokeText(txt, CX, top+30);
    ctx.fillStyle = left<5 ? '#ff8a9a' : '#ffd98a';
    ctx.fillText(txt, CX, top+30);
  }

  // 王血條
  if(G.bossFight && G.boss && !G.boss.dead){
    const hw=W*0.72, hx=CX-hw/2, hy=top+34, hh=16;
    ctx.fillStyle='rgba(0,0,0,.55)'; roundRect(hx,hy,hw,hh,8); ctx.fill();
    const r = Math.max(0, G.boss.hp/G.boss.max);
    ctx.fillStyle=GRAD.bossbar; roundRect(hx,hy,Math.max(4,hw*r),hh,8); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
    roundRect(hx,hy,hw,hh,8); ctx.stroke();
    ctx.font='800 12px system-ui'; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(G.boss.name+'  '+fmtNum(Math.ceil(G.boss.hp)), CX, hy+hh/2);
  }
}

/* ========== 更新 ========== */
let last=performance.now();
function update(dt){
  G.tick += dt;
  if(G.state!=='play') return;

  // 橫向移動（戰鬥時自動回到中路；城牆防守時保留操控，走位是玩法的一部分）
  if(G.combat || G.bossFight) G.targetX += (0 - G.targetX) * Math.min(1, dt*7);
  if(G.siege) G.targetX = clampX(G.targetX);
  G.x += (G.targetX - G.x) * Math.min(1, dt*11);

  // 兵種晉升的當下給一次明確回饋，否則玩家不會注意到自己的兵變了
  // 連續軍階只升不降，混編比例才會單向往前走
  const nowF = tierFloat(G.army);
  if(nowF > G.rankF) G.rankF = nowF;   // 存檔在晉升與關卡結束時寫，不必每幀碰 localStorage
  const nowTier = Math.floor(G.rankF);
  if(nowTier > (G.rank|0)){
    G.rank = nowTier;
    saveGame({ rankF: G.rankF });
    // 起始 t 為負值 = 延後 0.35 秒才現身。晉升幾乎都發生在通過閘門的同一幀，
    // 直接跳出來會被閘門自己的浮字、粒子、閃光蓋掉，玩家根本看不到。
    G.promo = { name: TIER_NAME[nowTier], t: -0.35 };
    Analytics.send('tier_up', {tier:nowTier, tierName:TIER_NAME[nowTier], army:Math.round(G.army)});
  }

  if(G.promo){
    const was = G.promo.t;
    G.promo.t += dt;
    if(was < 0 && G.promo.t >= 0){          // 橫幅現身的那一刻才放特效
      burst(G.x, G.z, 34, '#ffd257');
      G.flash = 0.30; G.flashColor = '255,220,120';
      beep(720,.18,'triangle',.07); setTimeout(()=>beep(980,.24,'triangle',.07), 130);
    }
    if(G.promo.t > 1.85) G.promo = null;
  }

  const frozen = !!G.combat || G.bossFight || !!G.siege;
  if(!frozen){
    G.z += G.speed * dt;
  }
  camZ = G.z - PLAYER_DZ;

  // 閘門
  for(const o of G.objs){
    if(o.type==='gate' && !o.used && G.z >= o.z){
      o.used = true;
      const op = G.x < 0 ? o.left : o.right;
      const before = G.army;
      if(op.op==='+') G.army += op.val;
      else if(op.op==='%') G.army += Math.floor(G.army * op.val / 100);
      else if(op.op==='-') G.army -= op.val;
      else if(op.op==='x') G.army = Math.floor(G.army*op.val);
      else if(op.op==='/') G.army = Math.floor(G.army/op.val);
      G.army = Math.max(0, G.army);
      const diff = G.army - before;
      const good = diff>=0;
      Analytics.send('gate_choice', {
        level:G.level, before, after:G.army,
        picked:(G.x<0?'L':'R'),
        l:opLabel(o.left), r:opLabel(o.right)
      });
      addFloat((good?'+':'-')+fmtNum(Math.abs(diff)), good?'#7dffc0':'#ff7d92', G.x, G.z+1.2, 1.25);
      burst(G.x, G.z, good?14:10, good?'#7dffc0':'#ff6b8a');
      beep(good?660:180, .12, good?'triangle':'sawtooth', .06);
      G.flash = good?0.18:0.3; G.flashColor = good?'120,255,190':'255,60,80';
      if(G.army<=0) return lose();
    }
  }

  // 遭遇敵軍
  if(!G.combat && !G.bossFight){
    for(const o of G.objs){
      if(o.type==='squad' && !o.dead && G.z >= o.z-2.2){
        // 敵軍人數在遭遇的當下才決定，讓畫面上的數字與實際損耗一致
        G.combat = o; o.engaged=true; G.checkpointArmy = G.army;
        o.start = Math.max(4, Math.round(G.army * o.frac));
        o.count = o.start;
        addFloat('衝鋒！','#ffe9a8', 0, o.z-1.2, 0.95);
        beep(120,.2,'sawtooth',.07);
        break;
      }
    }
  }

  // 戰鬥結算：按比例損耗。帶得多存活比例高，但代價永遠存在，
  // 不會像原本的「雙方扣相同絕對值」那樣被兵力成長稀釋成零。
  if(G.combat){
    const q=G.combat;
    if(q.toll === undefined){
      const gi = G.giant ? (1 - SIEGE.tollMul * G.giant.power) : 1;
      q.toll = G.army * q.frac * MUL.loss() * gi;   // 兵力 × 比例 × 鐵甲 × 巨人
      q.paid = 0;
      q.dur  = Math.max(0.5, Math.min(1.5, q.frac * 7));
    }
    const d = Math.min(q.toll - q.paid, q.toll / q.dur * dt);
    G.army -= d; q.paid += d;
    q.count = Math.max(0, q.start * (1 - q.paid/q.toll));
    G.shake = 4;
    if(Math.random()<dt*26) burst(rnd(-1.2,1.2), q.z-0.9, 3, '#ffd05a');
    if(Math.random()<dt*9) beep(rnd(90,160),.05,'square',.03);
    if(q.paid >= q.toll - 1e-6){
      q.count=0; q.dead=true; G.combat=null;
      addFloat('突破！','#ffd98a', 0, q.z, 1.1);
      burst(0,q.z,26,'#ffd05a');
      beep(880,.16,'triangle',.06);
    }
    if(G.army<=0){ G.army=0; return lose(); }
  }

  // 城牆防守
  if(!G.siege && !G.combat && !G.bossFight){
    for(const o of G.objs){
      if(o.type==='siege' && !o.done && G.z >= o.z-3){ startSiege(o); break; }
    }
  }
  if(G.siege){ updateSiege(dt); if(G.state!=='play') return; }

  // 王戰
  const b=G.boss;
  if(b && !b.dead && !G.combat && G.z >= b.z-6.2){
    if(!G.bossFight){
      G.bossFight=true;
      G.checkpointArmy = G.army;
      // 血量只由關卡決定。原本會被重設成 army*12，等於宣告前面所有選門無效。
      b.max = b.base;
      b.hp = b.max;
      beep(70,.5,'sawtooth',.08);
    }
  }
  if(G.bossFight && b && !b.dead){
    b.swing += dt;
    const gb = G.giant ? (1 + SIEGE.bossMul * G.giant.power) : 1;
    b.hp -= Math.pow(Math.max(0,G.army), BAL.bossDmgExp) * BAL.bossDmgC * MUL.boss() * gb * dt;
    G.army -= (G.army * b.dps + 2) * dt;
    G.shake = 3.5;
    if(Math.random()<dt*20) burst(rnd(-2,2), b.z-1.6, 2, '#ff9d4d');
    if(Math.random()<dt*14) burst(rnd(-2.2,2.2), G.z+0.6, 2, '#7de3ff');
    if(Math.random()<dt*6) beep(rnd(60,110),.06,'sawtooth',.035);
    if(b.hp<=0){
      b.hp=0; b.dead=true; G.bossFight=false;
      burst(0,b.z,60,'#ffd05a'); G.shake=14; G.flash=0.5; G.flashColor='255,220,120';
      beep(520,.3,'triangle',.08); setTimeout(()=>beep(780,.4,'triangle',.08),140);
      win();
    } else if(G.army<=0){ G.army=0; return lose(); }
  }

  // 特效更新
  for(let i=G.floats.length-1;i>=0;i--){
    const f=G.floats[i]; f.t+=dt; if(f.t>1.3) G.floats.splice(i,1);
  }
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i]; p.t+=dt;
    p.x+=p.vx*dt; p.z+=p.vz*dt; p.y+=p.vy*dt; p.vy-=9*dt;
    if(p.t>p.life){
      G.parts[i] = G.parts[G.parts.length-1]; G.parts.pop();
      if(_partPool.length < PART_MAX) _partPool.push(p);
    }
  }
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*22);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt*1.6);
}

/* ========== 繪製 ========== */
function render(){
  ctx.save();
  if(G.shake>0){
    ctx.translate(rnd(-G.shake,G.shake), rnd(-G.shake,G.shake));
  }
  // 天空
  if(skyCanvas) ctx.drawImage(skyCanvas,0,0,W,HZ+2);
  drawGround();

  // 收集可繪物件（由遠而近）
  const items=[];
  for(const o of G.objs){
    if(o.z < camZ+0.8 || o.z > camZ+80) continue;
    if(o.type==='squad' && o.dead) continue;
    if(o.type==='boss' && o.dead) continue;
    if(o.type==='siege') continue;
    // 防守期間先把王藏起來，否則牠會擋住整條路和要塞
    if(o.type==='boss' && G.siege) continue;
    items.push(o);
  }
  items.push({type:'player', z:G.z});
  if(G.siege) items.push({type:'giant', z:G.z + SIEGE.giantZ});
  else if(G.giant) items.push({type:'giant', z:G.z + 1.6});
  if(G.siege){
    // 遠處那道敵軍人牆全程在畫面上，壓迫感不中斷
    items.push({type:'horde', z:G.z + SIEGE.hordeZ});
    for(const f of G.siege.foes)    items.push({type:'sfoe',  z:f.z, f});
    for(const t of G.siege.tracers) items.push({type:'trace', z:(t.z0+t.z1)*0.5, t});
  }
  for(const p of G.parts) items.push({type:'part', z:p.z, p});
  for(const f of G.floats) items.push({type:'float', z:f.z, f});
  items.sort((a,b)=>b.z-a.z);

  for(const it of items){
    if(it.type==='deco') drawDeco(it);
    else if(it.type==='gate') drawGate(it);
    else if(it.type==='squad') drawSquad(it);
    else if(it.type==='boss') drawBoss(it);
    else if(it.type==='player'){
      drawCrowd(G.x, G.z, Math.max(1,Math.floor(G.army)), ALLY_TIERS, 1,
                G.siege ? SIEGE.crowdSpread : 1);
    }
    else if(it.type==='giant'){
      if(G.siege) drawGiant(SIEGE.giantX, it.z, 1, Math.min(1, G.siege.killed / G.siege.quota));
      else drawGiant(G.x, it.z, 1, 1);   // 加入後站隊伍正中間
    }
    else if(it.type==='horde') drawCrowd(3.0, it.z, 120, FOE_TIERS, -1, 1.5);
    else if(it.type==='sfoe'){
      // 每個「單位」畫成一小簇，路上才有影片那種黑壓壓的量感（純視覺，不影響數值）
      const f=it.f, s=scaleAt(f.z); if(!s) continue;
      const ph = f.ph + G.tick*9;
      const fp = FOE_TIERS[tierAt(G.rankF||0, f.q, FOE_TIERS.length)];
      drawUnit(px(f.x-0.62,s), py(0,s), s*0.90, fp, ph+2.1, -1);
      drawUnit(px(f.x+0.62,s), py(0,s), s*0.90, fp, ph+4.2, -1);
      drawUnit(px(f.x,     s), py(0,s), s,      fp, ph,     -1);
    }
    else if(it.type==='trace'){
      const t=it.t, s0=scaleAt(t.z0), s1=scaleAt(t.z1); if(!s0||!s1) continue;
      ctx.globalAlpha = Math.max(0, 1 - t.t/t.life);
      ctx.strokeStyle='#ffe9a8'; ctx.lineWidth=Math.max(1, s0*0.028);
      ctx.beginPath();
      ctx.moveTo(px(t.x0,s0), py(0.55,s0));
      ctx.lineTo(px(t.x1,s1), py(0.55,s1));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    else if(it.type==='part'){
      const p=it.p, s=scaleAt(p.z); if(!s) continue;
      const a = 1 - p.t/p.life;
      ctx.globalAlpha=Math.max(0,a);
      ctx.fillStyle=p.color;
      const r=Math.max(1, s*0.07);
      ctx.beginPath(); ctx.arc(px(p.x,s), py(p.y,s), r,0,6.283); ctx.fill();
      ctx.globalAlpha=1;
    }
    else if(it.type==='float'){
      const f=it.f, s=scaleAt(f.z); if(!s) continue;
      const a = 1 - f.t/1.3;
      ctx.globalAlpha=Math.max(0,a);
      const fs=Math.max(14, s*0.55*f.size);
      ctx.font='900 '+fs+'px system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const yv = py(1.6 + f.t*2.6, s);
      ctx.lineWidth=Math.max(2,fs*0.16); ctx.strokeStyle='rgba(0,0,0,.7)';
      ctx.strokeText(f.text, px(f.x,s), yv);
      ctx.fillStyle=f.color; ctx.fillText(f.text, px(f.x,s), yv);
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();

  // 閃光
  if(G.flash>0){
    ctx.fillStyle='rgba('+G.flashColor+','+(G.flash*0.55)+')';
    ctx.fillRect(0,0,W,H);
  }
  // 暗角
  ctx.fillStyle=GRAD.vignette; ctx.fillRect(0,0,W,H);

  if(G.state==='play') drawHUD();
}

function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ========== 結果 ========== */
const $ = id => document.getElementById(id);
let pendingNext = null, lastReward = 0, reviveUsed = false;

function showResult(title, desc, stat, nextLabel){
  G.state='result';
  $('resTitle').textContent=title;
  $('resDesc').innerHTML=desc;
  $('resStat').textContent=stat;
  $('nextBtn').textContent=nextLabel;
  $('result').classList.remove('hidden');
  $('swipeHint').classList.add('hidden');
}
// 金幣：殘存兵力 + 關卡獎金，再乘上「戰利品袋」
function earnGold(survivors, level){
  const g = Math.max(1, Math.round((survivors*0.35 + level*22) * MUL.gold()));
  saveGame({ gold: loadSave().gold + g });
  return g;
}
function setReward(text){ $('resReward').textContent = text || ''; }

function win(){
  const n=Math.floor(G.army);
  G.best=Math.max(G.best,n);
  G.state='result';          // 立刻凍結推進，否則這 700ms 內隊伍會跑出關卡尾端
  const sv = loadSave();
  saveGame({ best:G.best, maxLevel:Math.max(sv.maxLevel, G.level+1), runs:sv.runs+1,
             rankF:G.rankF, giant:G.giant });
  lastReward = earnGold(n, G.level);
  Analytics.send('run_end', {result:'win', level:G.level, army:n, gold:lastReward});
  setTimeout(()=>{
    showResult('⚔️ 王國得勝','你擊倒了 <b>'+G.boss.name+'</b><br>暗影之地又退了一步。',
      '殘存兵力：'+fmtNum(n)+' ／ 最高紀錄：'+fmtNum(G.best), '前往第 '+(G.level+1)+' 關');
    setReward('🪙 +'+lastReward);
    // 正向情緒下的曝光，接受率最高，且不影響沒看廣告的玩家
    showAdButton('double', '📺 金幣加倍 +'+lastReward);
    pendingNext = ()=> startLevel(G.level+1, n);
  }, 700);
}
function lose(){
  G.state='result';
  const fell = Math.max(0, Math.floor(G.checkpointArmy||0));
  Analytics.send('level_fail', {
    level:G.level, at: G.siege ? 'siege' : (G.bossFight ? 'boss' : (G.combat ? 'squad' : 'gate')),
    z: Math.round(G.z), army: fell
  });
  G.army=0;
  burst(G.x,G.z,30,'#ff6b8a'); G.shake=12;
  const sv = loadSave();
  G.giant = null;   // 全軍覆沒，巨人也一起沒了
  saveGame({ best:G.best, runs:sv.runs+1, rankF:G.rankF, giant:null });
  lastReward = earnGold(0, Math.max(0, G.level-1));
  Analytics.send('run_end', {result:'lose', level:G.level, gold:lastReward});
  setTimeout(()=>{
    showResult('💀 全軍覆沒','你的騎士倒在了第 '+G.level+' 關。<br>下次記得比較一下兩道門的數字。',
      '最高紀錄：'+fmtNum(G.best)+' 兵力', '再挑戰一次');
    setReward('🪙 +'+lastReward);
    // 失敗畫面是流失最集中的位置，也是市場資料指名該放復活的位置
    if(!reviveUsed && fell > 0)
      showAdButton('revive', '📺 以 '+fmtNum(Math.max(BAL.ref(G.level), Math.round(fell*0.6)))+' 兵力續戰');
    else showAdButton(null);
    pendingNext = ()=> startLevel(G.level, 0);
  }, 500);
}

/* ---------- 獎勵式影片按鈕 ---------- */
let adAction = null;
function showAdButton(kind, label){
  const btn = $('adDoubleBtn');
  if(!kind || !Ads.available()){ btn.classList.add('hidden'); adAction = null; return; }
  btn.classList.remove('hidden');
  btn.textContent = label;
  adAction = kind;
}
$('adDoubleBtn').onclick = ()=>{
  const kind = adAction; if(!kind) return;
  $('adDoubleBtn').disabled = true;
  Ads.rewarded(kind).then(ok=>{
    $('adDoubleBtn').disabled = false;
    if(!ok){ showAdButton(null); return; }
    if(kind === 'double'){
      saveGame({ gold: loadSave().gold + lastReward });
      setReward('🪙 +'+(lastReward*2)+'（已加倍）');
      showAdButton(null);
    }else if(kind === 'revive'){
      reviveUsed = true;
      const back = Math.max(BAL.ref(G.level), Math.round((G.checkpointArmy||0)*0.6));
      showAdButton(null);
      $('result').classList.add('hidden');
      resumeFromRevive(back);
    }
  });
};
// 原地續戰。刻意「不」重置王的血量 —— 從頭再打一次的話，
// 這支廣告等於沒有價值；保留已造成的傷害才是真的第二次機會。
function resumeFromRevive(army){
  G.army = army;
  G.combat = null; G.siege = null;
  G.z = Math.max(0, G.z - 4);
  for(const o of G.objs){
    if(o.type==='squad' && !o.dead && o.z > G.z){ o.engaged=false; o.toll=undefined; }
    if(o.type==='siege' && !o.done && o.z > G.z){ o.done = true; }  // 防守戰不重來
  }
  G.state='play';
  Analytics.send('revive', {level:G.level, army, bossHp: G.boss ? Math.round(G.boss.hp) : null});
  addFloat('援軍抵達！','#7dffc0', G.x, G.z+2, 1.2);
  G.flash = .35; G.flashColor = '120,255,190';
}

/* ---------- 升級面板 ---------- */
function renderUpgrades(){
  const sv = loadSave();
  $('upGold').textContent = '🪙 '+fmtNum(sv.gold);
  const list = $('upList');
  list.innerHTML = '';
  for(const u of UPGRADES){
    const lv = sv.up[u.key]|0;
    const maxed = lv >= u.max;
    const cost = upCost(u, lv);
    const row = document.createElement('div');
    row.className = 'up';
    const pips = Array.from({length:u.max}, (_,i)=>
      '<span class="up-pip'+(i<lv?' on':'')+'"></span>').join('');
    row.innerHTML =
      '<div class="up-info"><div class="up-name">'+u.name+' <span style="color:#ffd257">Lv.'+lv+'</span></div>'+
      '<div class="up-desc">'+u.desc+'</div><div class="up-pips">'+pips+'</div></div>';
    const btn = document.createElement('button');
    btn.className = 'up-buy' + (maxed?' max':'');
    btn.textContent = maxed ? '已滿' : '🪙 '+cost;
    btn.disabled = maxed || sv.gold < cost;
    btn.onclick = ()=>{
      const cur = loadSave();
      const l = cur.up[u.key]|0;
      const c = upCost(u, l);
      if(l >= u.max || cur.gold < c) return;
      cur.up[u.key] = l+1;
      saveGame({ gold: cur.gold - c, up: cur.up });
      Analytics.send('upgrade_buy', {key:u.key, level:l+1, cost:c});
      beep(880,.12,'triangle',.06);
      renderUpgrades();
    };
    row.appendChild(btn);
    list.appendChild(row);
  }
}
function openUpgrades(from){
  renderUpgrades();
  $('upgrade').classList.remove('hidden');
  $('menu').classList.add('hidden');
  $('result').classList.add('hidden');
  upgradeFrom = from;
  Analytics.send('upgrade_open', {from});
}
let upgradeFrom = 'menu';
$('upCloseBtn').onclick = ()=>{
  $('upgrade').classList.add('hidden');
  if(upgradeFrom === 'result') $('result').classList.remove('hidden');
  else $('menu').classList.remove('hidden');
};
$('upBtn').onclick   = ()=> openUpgrades('result');
$('menuUpBtn').onclick = ()=> openUpgrades('menu');

$('nextBtn').onclick = ()=>{ if(pendingNext) pendingNext(); };
$('retryBtn').onclick = ()=>{ G.best=Math.max(G.best,Math.floor(G.army)); startLevel(1,0); };
$('startBtn').onclick = ()=>{
  resumeAudio();
  startLevel(startAtLevel, 0);
};

/* ========== 啟動 ========== */
const saved = loadSave();
G.best = saved.best;
G.rankF = saved.rankF || 0;
G.giant = saved.giant || null;
G.rank  = Math.floor(G.rankF);
muted  = saved.muted;
document.getElementById('mute').textContent = muted ? '✕' : '♪';
// 上次打到第幾關就從那裡開始，回訪的人不用從頭重來
const startAtLevel = Math.max(1, saved.maxLevel|0);
if(saved.best > 0){
  document.getElementById('startBtn').textContent = '繼續遠征 · 第 '+startAtLevel+' 關';
  document.querySelector('#menu .hint').textContent =
    '最高紀錄 '+fmtNum(saved.best)+' 兵力 ／ 支援觸控與鍵盤';
}
resize();
requestAnimationFrame(loop);
// 只在 ?debug=1 時對外暴露，避免上架後被直接改分數
if(DEBUG){ window.__game = G; window.__analytics = Analytics; }
})();
</script>
